name: autoprint_customer
description: AutoPrint customer app - QR scan, file upload, UPI payment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^10.3.8
  mobile_scanner: ^7.0.0
  url_launcher: ^6.2.0
  shared_preferences: 2.2.3
  permission_handler: ^11.3.1
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/icon/icon.png"
