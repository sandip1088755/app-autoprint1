name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name autoprint_customer .
          fi
          flutter pub get

      - name: Set Android SDK levels
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?[ =]+[^ }]+/compileSdk = 36/' "$f"
              sed -i -E 's/minSdk(Version)?[ =]+[^ }]+/minSdk = 23/' "$f"
              echo "Updated $f"
            fi
          done

      - name: Generate app icons
        if: hashFiles('assets/icon/icon.png') != ''
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: autoprint-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
