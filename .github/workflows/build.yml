name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name autoprint_customer .
          fi
          flutter pub get

      - name: Force compileSdk 36 for all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'KTS'

subprojects {
    afterEvaluate {
        if (hasProperty("android")) {
            extensions.configure<com.android.build.gradle.BaseExtension> {
                compileSdkVersion(36)
            }
        }
    }
}
KTS
            echo "Patched android/build.gradle.kts"
          fi
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'GRADLE'

subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android.compileSdkVersion 36
        }
    }
}
GRADLE
            echo "Patched android/build.gradle"
          fi

      - name: Generate app icons
        if: hashFiles('assets/icon/icon.png') != ''
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: autoprint-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
